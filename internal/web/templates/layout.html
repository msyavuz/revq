{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · revq</title>
<script>try{var t=localStorage.getItem("revq-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="preload" href="/static/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="22" height="22">revq</a>
  <nav>
    <a href="/"{{if eq .Title "Board"}} aria-current="page"{{end}}>Board</a>
    <a href="/settings"{{if eq .Title "Settings"}} aria-current="page"{{end}}>Settings</a>
    <a href="/account"{{if eq .Title "Account"}} aria-current="page"{{end}}>Account</a>
  </nav>
  <div class="meter{{if .OverBudget}} over{{end}}" title="Agent spend today, out of the daily budget">
    <span>{{money .Spend}} of {{money .Budget}} today</span>
    {{if .OverBudget}}<span>agent paused</span>{{end}}
    {{if .Queued}}<span>{{.Queued}} queued</span>{{end}}
  </div>
  <button type="button" class="ghost theme" id="theme" title="Switch between following the system, light and dark">Auto</button>
  <form method="post" action="/poll"><button>Sync now</button></form>
  <form method="post" action="/logout"><button class="ghost">Sign out</button></form>
</header>
{{if .Flash}}<div class="flash" role="status">{{.Flash}}</div>{{end}}
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
